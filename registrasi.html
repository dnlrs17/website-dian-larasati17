```html
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>K-Movie - Registrasi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="logo-film.jpg">
</head>

<body>

    <header>
        <h1>K-MOVIE</h1>
        <p>Famous Korean Movies</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="profil.html">Profil</a>
        <a href="movies.html">Movies</a>
        <a href="gallery.html">Gallery</a>
        <a href="kontak.html">Contact</a>
        <a href="registrasi.html">Registrasi</a>
    </nav>

    <div class="container">

        <h2 class="judul">Registrasi Pelanggan</h2>

        <div class="kontak">

            <form>

                <label>Nama Lengkap</label>
                <input type="text" name="nama" placeholder="Masukkan nama lengkap">

                <label>Email</label>
                <input type="email" name="email" placeholder="Masukkan email">

                <label>Password</label>
                <input type="password" name="password" placeholder="Masukkan password">

                <label>Pilih Paket</label>
                <select name="paket">
                    <option>Basic</option>
                    <option>Premium</option>
                    <option>VIP</option>
                </select>

                <br><br>

                <label>Pilihan Pembayaran</label>

                <p>
                    <input type="radio" name="pembayaran" value="kartu">
                    Kartu Debit/Kredit
                </p>

                <p>
                    <input type="radio" name="pembayaran" value="dompet">
                    Dompet Digital
                </p>

                <label>Nomor Kartu</label>
                <input type="text" name="kartu" placeholder="Masukkan nomor kartu">

                <p>
                    <img src="visa_logo.png" width="60">
                    <img src="mastercard_logo.png" width="60">
                </p>

                <p>
                        <img src="dana_logo.png" width="60">
                        <img src="ovo_logo.jpeg" width="60">
                        <img src="gopay_logo.png" width="60">
                </p>

                <button type="submit">Submit</button>

            </form>

        </div>

    </div>

    <footer>
        <p>© 2026 K-Movie</p>
    </footer>

</body>

</html>
```
